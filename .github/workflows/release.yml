# Build and publish plugin to a GitHub Release when a release is published.
# The release zip is attached to the release. Plugin manifest is hosted elsewhere (e.g. PluginRepos).

name: Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout (tag for build)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          New-Item -ItemType Directory -Force "$env:AppData\XIVLauncher\addon\Hooks\dev" | Out-Null
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build PSortPlus.sln --configuration Release --no-incremental

      - name: Zip plugin
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $out = "PSortPlus\bin\x64\Release"
          if (-not (Test-Path $out)) {
              $dll = Get-ChildItem -Path "PSortPlus\bin" -Recurse -Filter "PSortPlus.dll" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
              if ($dll) { $out = $dll.DirectoryName }
          }
          Compress-Archive -Path "$out\*" -DestinationPath "PSortPlus-$tag.zip"

      - name: Upload zip to release
        run: gh release upload "${{ github.event.release.tag_name }}" "PSortPlus-${{ github.event.release.tag_name }}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger PluginRepos update
        run: |
          gh api /repos/tenyu27/PluginRepos/dispatches `
            --method POST `
            -H "Accept: application/vnd.github.v3+json" `
            -f event_type="update-plugins"
        env:
          GH_TOKEN: ${{ secrets.PAT }}

