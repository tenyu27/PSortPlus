# Build and publish plugin to a GitHub Release when a release is published.
# Release zip is attached to the release. Plugin manifest is hosted elsewhere (e.g. PluginRepos).

name: Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          New-Item -ItemType Directory -Force "$env:AppData\XIVLauncher\addon\Hooks\dev" | Out-Null
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build PSortPlus.sln -c Release -p:Platform=x64 --no-incremental

      - name: Get Version
        id: version
        run: |
          $json = Get-Content PSortPlus/PSortPlus.json -Raw | ConvertFrom-Json
          $ver = $json.AssemblyVersion
          Write-Output "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Zip plugin
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zipName = "PSortPlus-${ver}.zip"
          $dll = Get-ChildItem -Path "PSortPlus" -Recurse -Filter "PSortPlus.dll" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) { throw "PSortPlus.dll not found under PSortPlus (Release)" }
          $outDir = $dll.Directory.FullName
          if (-not (Test-Path -LiteralPath $outDir)) { throw "Output dir missing: $outDir" }
          $tempDir = Join-Path (Get-Location) "temp_zip"
          $pluginDir = Join-Path $tempDir "PSortPlus"
          New-Item -ItemType Directory -Force $pluginDir | Out-Null
          Copy-Item -Path "$outDir\*" -Destination $pluginDir -Recurse
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($tempDir, (Join-Path (Get-Location) $zipName))

      - name: Create or Update Release
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $zipName = "PSortPlus-${ver}.zip"
          gh release create $ver $zipName --title "Release $ver" --notes "Automated build for version $ver" || gh release upload $ver $zipName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger PluginRepos update
        run: |
          gh api /repos/tenyu27/PluginRepos/dispatches `
            --method POST `
            -H "Accept: application/vnd.github.v3+json" `
            -f event_type="update-plugins"
        env:
          GH_TOKEN: ${{ secrets.PAT }}
